<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style poster maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="lede">Your photo, four panels, one sunset poster. Drag a photo inside its panel to move it.</p>

    <h2>Photos</h2>
    <label class="check"><input id="fill-all" type="checkbox" checked> One photo in every panel</label>
    <div class="slot active">
      <span class="slot-name">Panel 1</span>
      <input type="file" accept="image/*" data-slot="0">
      <span class="slot-btns">
        <button type="button" class="sample" data-slot="0" data-sample="pier">Pier</button>
        <button type="button" class="sample" data-slot="0" data-sample="boulevard">Blvd</button>
        <button type="button" class="clear" data-slot="0">Clear</button>
      </span>
    </div>
    <div class="slot">
      <span class="slot-name">Panel 2</span>
      <input type="file" accept="image/*" data-slot="1">
      <span class="slot-btns">
        <button type="button" class="sample" data-slot="1" data-sample="pier">Pier</button>
        <button type="button" class="sample" data-slot="1" data-sample="boulevard">Blvd</button>
        <button type="button" class="clear" data-slot="1">Clear</button>
      </span>
    </div>
    <div class="slot">
      <span class="slot-name">Panel 3</span>
      <input type="file" accept="image/*" data-slot="2">
      <span class="slot-btns">
        <button type="button" class="sample" data-slot="2" data-sample="pier">Pier</button>
        <button type="button" class="sample" data-slot="2" data-sample="boulevard">Blvd</button>
        <button type="button" class="clear" data-slot="2">Clear</button>
      </span>
    </div>
    <div class="slot">
      <span class="slot-name">Panel 4</span>
      <input type="file" accept="image/*" data-slot="3">
      <span class="slot-btns">
        <button type="button" class="sample" data-slot="3" data-sample="pier">Pier</button>
        <button type="button" class="sample" data-slot="3" data-sample="boulevard">Blvd</button>
        <button type="button" class="clear" data-slot="3">Clear</button>
      </span>
    </div>

    <h2>Layout</h2>
    <div class="row">
      <button type="button" class="layout-btn on" data-layout="hero">Hero + 3</button>
      <button type="button" class="layout-btn" data-layout="grid">Comic grid</button>
      <button type="button" class="layout-btn" data-layout="strip">Triple strip</button>
      <button type="button" class="layout-btn" data-layout="duo">Split duo</button>
    </div>

    <h2>Colour grade</h2>
    <div class="row">
      <button type="button" class="grade-btn on" data-grade="sunset">Sunset</button>
      <button type="button" class="grade-btn" data-grade="neon">Neon</button>
      <button type="button" class="grade-btn" data-grade="noir">Noir</button>
    </div>

    <h2>Post size</h2>
    <div class="row">
      <button type="button" class="size-btn on" data-size="square">1080 × 1080</button>
      <button type="button" class="size-btn" data-size="portrait">1080 × 1350</button>
      <button type="button" class="size-btn" data-size="wide">1920 × 1080</button>
    </div>

    <h2>Caption</h2>
    <label>Title <input id="title" type="text" maxlength="40" value="Sunset Heist"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="60" value="One last job under the neon sky"></label>

    <h2>Selected panel</h2>
    <p id="panel-hint" class="hint"></p>
    <label>Zoom <span id="zoom-val">1.00×</span>
      <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
    </label>
    <button id="reset-view" type="button">Reset panel view</button>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The poster preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
